<!DOCTYPE html>
<html dir="rtl">
<meta charset="utf-8" />
<meta id="vport" name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" type="text/css" href="css/font-awesome-4.7.0/css/font-awesome.min.css">
<link href="bootstrap.4.5.3/css/bootstrap-grid.min.css" rel="stylesheet" media='all' />
<link href="bootstrap.4.5.3/css/bootstrap-reboot.min.css" rel="stylesheet" media='all' />
<link href="bootstrap.4.5.3/css/bootstrap.min.css" rel="stylesheet" media='all' />
<link rel="stylesheet" href="css/myappcss.css?t=1"  />

<style>
   * {
        box-sizing: border-box;
    }

    body {
        background-color: #ffffff;
    }

    #regForm {
        background-color: #ffffff;
        margin: 0px auto;

        padding: 20px;
        width: 100%;

        min-width: 300px;
    }

    h1 {
        text-align: center;
    }

    input {
        padding: 5px;
        width: 100%;
        font-size: 15px;
        font-family: Raleway;
        border: 1px solid #aaaaaa;
    }

        /* Mark input boxes that gets an error on validation: */
        input.invalid {
            background-color: #ffdddd;
        }

    /* Hide all steps by default: */
    .tab {
        display: none;
    }

    button {
        background-color: #1E94CA;
        color: #ffffff;
        border: none;
        padding: 5px 10px;
        font-size: 15px;
        font-family: Raleway;
        cursor: pointer;
    }

        button:hover {
            opacity: 0.8;
        }

    #prevBtn {
        background-color: #bbbbbb;
    }

    /* Make circles that indicate the steps of the form: */
    .step {
        height: 10px;
        width: 10px;
        margin: 0 2px;
        background-color: #bbbbbb;
        border: none;
        border-radius: 50%;
        display: inline-block;
        opacity: 0.5;
    }

        .step.active {
            opacity: 1;
        }

        /* Mark the steps that are finished and valid: */
        .step.finish {
            background-color: #4CAF50;
        }

    /*table style */
    #myInput {
        background-image: url('css/searchicon.png');
        background-position: 10px 10px;
        background-repeat: no-repeat;
        width: 100%;
        font-size: 15px;
        padding: 5px;
        border: 1px solid #ddd;
        margin-bottom: 12px;
    }

.btn-dark
{
background-color: #1E94CA;

}

    #table_div {

        width: 100%;
        overflow-y: scroll;
    }
    #myTable {
        font-weight: normal;
        font-size: small;

        overflow-x: auto;
        white-space: nowrap;
    }
        #myTable thead {
            background-color: #1E94CA;
            color: white;
            
            font-weight: normal;
        }
        #myTable tbody {
           font-family:sans-serif,Tahoma,'Times New Roman',Arial;
        }
    #cnfrmlist li  {
     font-weight:bold;
    }
    #cnfrmlist li>p {
        font-family: sans-serif,Tahoma,'Times New Roman',Arial;
    }
 .myfontfmly  {
        font-family: sans-serif,Tahoma,'Times New Roman',Arial;
    }
</style>
<body>


    <div id="regForm">
        <h3 class="d-none">B'&E) 'DB1'!* 'DJHEJ)</h3>
        <!-- One "tab" for each step in the form: -->
        <div class="alert alert-danger d-none text-center" id="error">
            <button id="btnretry" class="btn-sm btn-dark btn-link" onclick="loadReadingsData()">'DE-'HD) E1) '.1I</button>
        </div>
        <div class="d-block text-center" id="loading">

        </div>


        <div class=" text-right">

            <div class="table-wrap  " id="customer_table">
                <div class="row">
                    <div class="col-8"> <input type="text" id="myInput" onkeyup="serachInList()" placeholder="بحث..." title="Type in a name"></div>
                    <div class="col-4 pt-1"> <button class="btn-sm btn-dark btn-block " onclick="loadReadingsData()"> <span class="fa fa-search"></span> بحث</button></div>
                </div>


                <div id="table_div" class="d-block w-100">

                </div>

            </div>

        </div>



    </div>

    <script type="text/javascript" src="js/jquery-3.0.0.min.js"></script>

    <script type="text/javascript" src="bootstrap.4.5.3/js/bootstrap.bundle.min.js"></script>

    <script type="text/javascript" src="js/readinglist.js?t=2"></script>

</body>
</html>
